plugins {
    id 'java-gradle-plugin'
}

group = 'com.example.gsb'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

gradlePlugin {
    plugins {
        licenseCheck {
            id = 'com.example.gsb.license-check'
            implementationClass = 'com.example.gsb.license.LicenseCheckPlugin'
            displayName = 'License Check Plugin'
            description = 'Collects third-party dependency licenses and enforces allow/deny rules'
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation gradleTestKit()
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
